<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Made Easy: Practice Editor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter & Fira Code Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }
        textarea::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #090d16;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8 flex items-center justify-center">

    <div class="w-full max-w-6xl bg-slate-800/80 backdrop-blur-lg rounded-2xl shadow-2xl p-6 md:p-8 border border-slate-700/60 my-auto">
        
        <!-- Header Section -->
        <div class="mb-6">
            <span class="inline-block bg-purple-600 text-white text-[11px] font-bold px-3 py-1 rounded-full tracking-wider uppercase mb-2 shadow-sm">
                PROTOTYPE / Draft
            </span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight flex items-center gap-3">
                <span>HTML Made Easy: Practice Editor</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base mt-1">
                Edit the raw HTML code on the left to see your live browser preview on the right.
            </p>
        </div>

        <hr class="border-slate-700 mb-6" />

        <!-- Quick HTML Tags Toolbar -->
        <div class="mb-6">
            <h2 class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-2.5 flex items-center gap-2">
                <i class="fa-solid fa-code text-amber-400"></i> Essential HTML Tags 
                <span class="text-xs text-slate-500 font-normal lowercase">(click to insert template)</span>
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button type="button" onclick="insertTag('<h1>Main Heading</h1>\n')" class="flex items-center justify-between p-3 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl transition-all duration-150 text-left group">
                    <span class="code-font text-sm font-bold text-amber-400 group-hover:scale-105 transition-transform">&lt;h1&gt;</span>
                    <span class="text-xs text-slate-400 font-medium">Main Heading</span>
                </button>

                <button type="button" onclick="insertTag('<p>This is a paragraph of text.</p>\n')" class="flex items-center justify-between p-3 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl transition-all duration-150 text-left group">
                    <span class="code-font text-sm font-bold text-amber-400 group-hover:scale-105 transition-transform">&lt;p&gt;</span>
                    <span class="text-xs text-slate-400 font-medium">Body Paragraph</span>
                </button>

                <button type="button" onclick="insertTag('<a href=&quot;https://google.com&quot; target=&quot;_blank&quot;>Clickable Link</a>\n')" class="flex items-center justify-between p-3 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl transition-all duration-150 text-left group">
                    <span class="code-font text-sm font-bold text-amber-400 group-hover:scale-105 transition-transform">&lt;a&gt;</span>
                    <span class="text-xs text-slate-400 font-medium">Clickable Link</span>
                </button>

                <button type="button" onclick="insertTag('<img src=&quot;https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=400&quot; alt=&quot;Sample Image&quot; />\n')" class="flex items-center justify-between p-3 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl transition-all duration-150 text-left group">
                    <span class="code-font text-sm font-bold text-amber-400 group-hover:scale-105 transition-transform">&lt;img&gt;</span>
                    <span class="text-xs text-slate-400 font-medium">Displays Image</span>
                </button>
            </div>
        </div>

        <!-- Landscape Workspace Side by Side -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Code Editor Panel (Left) -->
            <div class="flex flex-col rounded-xl overflow-hidden border border-slate-700 bg-slate-950 shadow-lg">
                <div class="bg-slate-900 px-4 py-3 flex justify-between items-center border-b border-slate-800">
                    <div class="flex items-center space-x-2">
                        <i class="fa-regular fa-file-code text-cyan-400 text-sm"></i>
                        <span class="text-xs code-font font-semibold text-slate-200">index.html (Input Stage)</span>
                    </div>
                    <span class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase bg-slate-800 px-2 py-0.5 rounded border border-slate-700">
                        Editable Code
                    </span>
                </div>
                <textarea 
                    id="htmlInput" 
                    class="w-full h-[420px] bg-slate-950 text-cyan-300 code-font p-4 text-sm focus:outline-none resize-none leading-relaxed" 
                    placeholder="Type HTML here..." 
                    spellcheck="false"><h1>Hello, World!</h1>
<p>Welcome to my first webpage.</p>
<a href="https://google.com" target="_blank">Visit Google</a></textarea>
            </div>

            <!-- Live Browser Preview Panel (Right) -->
            <div class="flex flex-col rounded-xl overflow-hidden border border-slate-700 bg-white shadow-lg">
                <div class="bg-sky-700 px-4 py-3 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-globe text-white text-sm"></i>
                        <span class="text-xs font-semibold text-white">Browser Preview (Output Stage)</span>
                    </div>
                    <span class="text-[10px] font-semibold tracking-wider text-sky-100 uppercase bg-sky-800/80 px-2 py-0.5 rounded flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Rendering
                    </span>
                </div>
                <div class="w-full h-[420px] bg-white">
                    <iframe id="previewFrame" class="w-full h-full border-none p-4"></iframe>
                </div>
            </div>

        </div>

    </div>

    <!-- Link to JavaScript -->
    <script src="script.js"></script>
</body>
</html>
